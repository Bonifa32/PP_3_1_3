<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактирование пользователя</title>
</head>
<body>

<h1>Редактировать пользователя</h1>

<form th:action="@{/admin/update}" method="post">
    <input type="hidden" name="id" th:value="${user.id}"/>

    <label>Имя:</label>
    <input type="text" name="name" th:value="${user.name}"/>

    <label>Фамилия:</label>
    <input type="text" name="lastname" th:value="${user.lastName}"/>

    <label>Возраст:</label>
    <input type="number" name="age" th:value="${user.age}"/>

    <br>

    <div>
        <label>Роли:</label>
        <div th:each="role : ${allRoles}">
            <label>
                <input type="checkbox" name="roleIds" th:value="${role.id}"
                       th:checked="${user.roles.contains(role)}"/>
                <span th:text="${role.roleName}"></span>
            </label>
        </div>
    </div>

    <label>Логин:</label>
    <input type="text" name="username" th:value="${user.username}"/>

    <label>Пароль:</label>
    <input type="text" name="password"/>

    <button type="submit">Сохранить</button>
</form>

<p><a th:href="@{/admin/users}">Назад к списку</a></p>

</body>
</html>
